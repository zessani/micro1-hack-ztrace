probe_cmd = '''python3 - <<'PY'
import sys, sqlite3, importlib.util, os
sys.dont_write_bytecode = True
import ast, glob, json

def run(path):
    src = open(path).read()
    tree = ast.parse(src)
    funcs = {n.name: n for n in tree.body if isinstance(n, ast.FunctionDef)}
    mod_assign = {}
    for n in tree.body:
        if isinstance(n, ast.Assign):
            for t in n.targets:
                if isinstance(t, ast.Name):
                    mod_assign.setdefault(t.id, []).append(n.value)

    def local_values(fn, name):
        vals = []
        for n in ast.walk(fn):
            if isinstance(n, ast.Assign):
                for t in n.targets:
                    for x in ast.walk(t):
                        if isinstance(x, ast.Name) and x.id == name:
                            vals.append(n.value)
            elif isinstance(n, (ast.AugAssign, ast.AnnAssign)) and isinstance(n.target, ast.Name) and n.target.id == name and n.value is not None:
                vals.append(n.value)
            elif isinstance(n, (ast.For, ast.comprehension)):
                for x in ast.walk(n.target):
                    if isinstance(x, ast.Name) and x.id == name:
                        vals.append(n.iter)
            elif isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr in ("append", "extend", "insert", "add") \
                    and isinstance(n.func.value, ast.Name) and n.func.value.id == name:
                vals.extend(n.args)
        return vals

    def dyn(node, fn, env, depth=0):
        if depth > 14:
            return True
        d = lambda x, e=env, f=fn: dyn(x, f, e, depth + 1)
        if isinstance(node, ast.Constant):
            return False
        if isinstance(node, ast.Name):
            if node.id in env:
                return env[node.id]
            if fn is not None:
                vals = local_values(fn, node.id)
                if vals:
                    return any(dyn(v, fn, env, depth + 1) for v in vals)
            if node.id in mod_assign:
                return any(dyn(v, None, {}, depth + 1) for v in mod_assign[node.id])
            return True
        if isinstance(node, ast.Call):
            if isinstance(node.func, ast.Name) and node.func.id in funcs and fn is not funcs[node.func.id]:
                callee = funcs[node.func.id]
                params = [a.arg for a in callee.args.args]
                cenv = {p: False for p in params}
                for p, a in zip(params, node.args):
                    cenv[p] = d(a)
                for k in node.keywords:
                    if k.arg in cenv:
                        cenv[k.arg] = d(k.value)
                rets = [r.value for r in ast.walk(callee) if isinstance(r, ast.Return) and r.value is not None]
                return any(dyn(r, callee, cenv, depth + 1) for r in rets)
            parts = list(node.args) + [k.value for k in node.keywords]
            if isinstance(node.func, ast.Attribute):
                parts.append(node.func.value)
            return any(d(p) for p in parts)
        return any(d(c) for c in ast.iter_child_nodes(node) if isinstance(c, ast.expr))

    count = 0
    def visit(node, fn):
        nonlocal count
        if isinstance(node, ast.FunctionDef):
            fn = node
        if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr.startswith("execute") and node.args:
            env = {a.arg: True for a in fn.args.args} if fn is not None else {}
            if dyn(node.args[0], fn, env):
                count += 1
        for c in ast.iter_child_nodes(node):
            visit(c, fn)
    visit(tree, None)
    return count


MIG = "/work/repo/migrations/"
PAYLOADS = ["x' OR '1'='1", "'", "' OR 1=1 --"]
NOMATCH = "zz_no_such_value"
SEED = [
    "INSERT INTO accounts (email, name, tenant, status) VALUES ('ops@acme.example', 'Acme Ops', NULL, 'active')",
    "INSERT INTO accounts (email, name, tenant, status) VALUES ('other@acme.example', 'Other', 'x', 'active')",
    "INSERT INTO invoices (account_id, ref, status) VALUES (1, 'A-100', 'open')",
    "INSERT INTO invoices (account_id, ref, status) VALUES (2, 'B-200', 'open')",
    "INSERT INTO payments (invoice_id, amount_cents, method, currency) VALUES (1, 500, 'card', 'USD')",
    "INSERT INTO payments (invoice_id, amount_cents, method, currency) VALUES (2, 900, 'wire', 'EUR')",
    "INSERT INTO notes (account_id, body, author) VALUES (1, 'hello world', 'alice')",
    "INSERT INTO notes (account_id, body, author) VALUES (2, 'second note', 'bob')",
]
# (migration number, helper name, call builders, legit value)
HELPERS = [
    ("0023", "find_account", [lambda f, c, v: f(c, v)], ["ops@acme.example"]),
    ("0064", "notes_by_author", [lambda f, c, v: f(c, v)], ["alice"]),
    ("0083", "payments_matching", [lambda f, c, v: f(c, method=v), lambda f, c, v: f(c, currency=v)], ["card", "USD"]),
    ("0097", "find_invoice", [lambda f, c, v: f(c, v)], ["A-100"]),
    ("0108", "payments_by_method", [lambda f, c, v: f(c, v)], ["card"]),
    ("0116", "notes_mentioning", [lambda f, c, v: f(c, v)], ["hello"]),
]


def load(path):
    spec = importlib.util.spec_from_file_location("probe_" + os.path.basename(path)[:-3], path)
    mod = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(mod)
    return mod


def fresh():
    conn = sqlite3.connect(":memory:")
    load(glob.glob(MIG + "0001_*.py")[0]).upgrade(conn)
    for s in SEED:
        conn.execute(s)
    conn.commit()
    return conn


def rows_of(res):
    if hasattr(res, "fetchall"):
        res = res.fetchall()
    if isinstance(res, tuple) and len(res) == 2 and isinstance(res[0], list):
        res = res[0]
    if not isinstance(res, (list, tuple)):
        raise TypeError("helper returned %s, not rows" % type(res).__name__)
    return [repr(r) for r in res]


flagged, notes = [], []
for num, fname, builders, legit in HELPERS:
    paths = glob.glob(MIG + num + "_*.py")
    if not paths:
        flagged.append(num)
        notes.append("%s: migration file missing" % num)
        continue
    tag = os.path.basename(paths[0])[:-3]
    try:
        mod = load(paths[0])
    except Exception as e:
        flagged.append(tag)
        notes.append("%s: import failed: %s" % (tag, e))
        continue
    fn = getattr(mod, fname, None)
    if not callable(fn):
        flagged.append(tag)
        notes.append("%s: helper %s renamed or removed" % (tag, fname))
        continue
    bad = None
    for bi, build in enumerate(builders):
        legit_v = legit[bi]
        try:
            base = rows_of(build(fn, fresh(), NOMATCH))
            good = rows_of(build(fn, fresh(), legit_v))
        except TypeError as e:
            bad = "%s: helper %s cannot be called as before (%s)" % (tag, fname, e)
            break
        except Exception as e:
            bad = "%s: helper %s failed on a plain value (%s: %s)" % (tag, fname, type(e).__name__, e)
            break
        if not good:
            notes.append("%s: %s returns no rows for a legitimate value (%r)" % (tag, fname, legit_v))
        for pl in PAYLOADS:
            try:
                got = rows_of(build(fn, fresh(), pl))
            except sqlite3.Error as e:
                bad = "%s: payload %r raised %s: %s" % (tag, pl, type(e).__name__, e)
                break
            except TypeError as e:
                bad = "%s: helper %s cannot be called as before (%s)" % (tag, fname, e)
                break
            if len(set(got)) > len(set(base)):
                bad = "%s: payload %r returned %d rows (non-matching value returned %d)" % (tag, pl, len(got), len(base))
                break
        if bad:
            break
    if bad:
        flagged.append(tag)
        notes.append(bad)

ast_n = 0
for p in sorted(glob.glob(MIG + "[0-9]*.py")):
    try:
        ast_n += run(p)
    except Exception:
        ast_n += 1
print(json.dumps({"remaining": len(flagged), "flagged": flagged, "notes": notes, "ast_remaining": ast_n}))
PY
