[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "northdesk"
version = "0.4.2"
description = "Helpdesk backend with ticket notification emails"
requires-python = ">=3.10"
dependencies = ["MarkupSafe==2.1.5"]

[tool.setuptools]
packages = ["northdesk"]
